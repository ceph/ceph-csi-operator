cephConnections:
  - name: cephcluster
    monitors: {}
clientProfiles:
  - name: rook-ceph
    cephConnection:
      name: cephcluster
    cephFs:
      subVolumeGroup: csi
drivers:
  nvmeof:
    storageClasses:
      - name: k8s-storage-e2e-nvmeof
        reclaimPolicy: Delete
        allowVolumeExpansion: false
        mountOptions:
          - discard
        # NVMe-oF volumes are RBD-backed, so reuse the RBD CSI secrets Rook creates.
        provisionerSecretName: rook-csi-rbd-provisioner
        provisionerSecretNamespace: rook-ceph
        nodeSecretName: rook-csi-rbd-node
        nodeSecretNamespace: rook-ceph
        parameters:
          clusterID: rook-ceph
          pool: nvmeofpool
          imageFeatures: layering
          csi.storage.k8s.io/fstype: ext4
          # NVMe-oF subsystem all volumes of this StorageClass belong to.
          subsystemNQN: nqn.2016-06.io.spdk:cnode1.rook-ceph
          # Gateway management API port. nvmeofGatewayAddress and listeners are
          # injected at test time by test/scripts/k8s-storage/patch-nvmeof-storageclass.sh
          # once the Rook gateway Pod IP is known.
          nvmeofGatewayPort: "5500"
