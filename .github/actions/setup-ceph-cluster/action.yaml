name: Setup Ceph Cluster
description: Setup Minikube, local disk, and deploy a Rook Ceph cluster

inputs:
  driverType:
    description: "CSI driver being tested. When 'nvmeof', also deploys the Rook NVMe-oF gateway."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    - name: Setup Minikube
      shell: bash
      run: test/scripts/github-action-helper.sh install_minikube_with_none_driver

    - name: Print k8s cluster status
      shell: bash
      run: kubectl get nodes

    - name: Install NVMe/TCP Kernel Modules
      shell: bash
      run: |
          sudo apt-get update -y 
          sudo apt-get install -y --no-install-recommends linux-modules-extra-$(uname -r)

    - name: Use local disk
      shell: bash
      run: test/scripts/github-action-helper.sh use_local_disk

    - name: Create Ceph cluster
      shell: bash
      run: test/scripts/github-action-helper.sh deploy_rook

    - name: Deploy NVMe-oF gateway
      if: inputs.driverType == 'nvmeof'
      shell: bash
      run: test/scripts/github-action-helper.sh deploy_nvmeof
