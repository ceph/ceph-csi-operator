name: Run E2E Storage Tests
description: Download kubernetes e2e binary, run external storage tests, and collect logs on failure

inputs:
  driverType:
    description: "The CSI driver to test (cephfs, rbd, nfs, nvmeof)"
    required: true
  logPrefix:
    description: "Prefix for log artifact names (e.g., helm, yaml, yaml-upgrade)"
    required: true

runs:
  using: "composite"
  steps:
    - name: Verify storage resources and wait for csi-config
      shell: bash
      run: |
          echo "=== Checking CephConnection and ClientProfile ==="
          kubectl get cephconnection,clientprofile -n csi-driver -o wide || true
          kubectl get configmap -n csi-driver || true

          echo "=== Waiting for csi-config ConfigMap to be populated ==="
          for i in {1..120}; do
            config=$(kubectl get configmap ceph-csi-config -n csi-driver -o jsonpath='{.data.config\.json}' 2>/dev/null || true)
            if [ -n "$config" ] && [ "$config" != "[]" ] && [ "$config" != "null" ]; then
              echo "csi-config ConfigMap is ready:"
              echo "$config"
              break
            fi
            sleep 2
          done
          if [ -z "$config" ] || [ "$config" = "[]" ] || [ "$config" = "null" ]; then
            echo "=== ERROR: csi-config ConfigMap not ready after 4 minutes ==="
            kubectl get configmap -n csi-driver -o yaml || true
            kubectl get cephconnection,clientprofile -n csi-driver -o yaml || true
            kubectl describe cephconnection,clientprofile -n csi-driver || true
            echo "=== Operator logs ==="
            kubectl logs -l control-plane=ceph-csi-op-controller-manager -n ceph-csi-operator-system --tail=100 || true
            kubectl logs -l app.kubernetes.io/name=ceph-csi-operator -n ceph-csi-operator-system --tail=100 || true
            exit 1
          fi

    - name: Download kubernetes e2e binary
      shell: bash
      env:
        KUBE_VERSION: v1.33.0
      run: |
          if [ ! -f ./kubernetes/test/bin/e2e.test ]; then
            curl -LO "https://dl.k8s.io/${KUBE_VERSION}/kubernetes-test-linux-amd64.tar.gz"
            tar xzf kubernetes-test-linux-amd64.tar.gz kubernetes/test/bin/ginkgo kubernetes/test/bin/e2e.test
          fi

    - name: Run E2E tests for ${{ inputs.driverType }}
      shell: bash
      run: |
          KUBECONFIG_TMP="$(mktemp -t kubeconfig.XXXXXXXX)"
          kubectl config view --raw --flatten > "${KUBECONFIG_TMP}"
          export KUBECONFIG="${KUBECONFIG_TMP}"

          ./kubernetes/test/bin/ginkgo \
          --vv \
          -focus="External.Storage.*${{ inputs.driverType }}.csi.ceph.com" \
          -skip='\[Feature:|\[Disruptive\]|Generic Ephemeral-volume' \
          ./kubernetes/test/bin/e2e.test \
          -- \
          -storage.testdriver="$(pwd)/test/scripts/k8s-storage/driver-${{ inputs.driverType }}.yaml"

    # Dump Ceph cluster status/health first so a cluster-health problem is
    # obvious at the top of the failed step, without digging through the
    # collected pod logs below.
    - name: Log Ceph cluster health
      if: failure()
      shell: bash
      run: |
          echo "=== rook-ceph pods ==="
          kubectl -n rook-ceph get pods -o wide || true
          echo "=== CephCluster ==="
          kubectl -n rook-ceph get cephcluster -o wide || true
          kubectl -n rook-ceph get cephcluster -o yaml || true

          toolbox=$(kubectl -n rook-ceph get pod -l app=rook-ceph-tools \
            -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          if [ -z "${toolbox}" ]; then
            echo "rook-ceph toolbox not found; skipping ceph CLI health dump"
            exit 0
          fi
          for cmd in "ceph status" "ceph health detail" "ceph osd tree" \
                     "ceph osd df" "ceph df" "ceph mon stat"; do
            echo "=== ${cmd} ==="
            # shellcheck disable=SC2086 # intentional word splitting of the command
            kubectl -n rook-ceph exec "${toolbox}" -- ${cmd} || true
          done

    - name: Collect logs on failure
      if: failure()
      shell: bash
      run: |
          LOG_DIR="${GITHUB_WORKSPACE}/logs-${{ inputs.logPrefix }}-${{ inputs.driverType }}"
          mkdir -p "${LOG_DIR}"

          kubectl get pods --all-namespaces -o wide > "${LOG_DIR}/all-pods.txt" 2>&1 || true
          kubectl get events --all-namespaces --sort-by='.lastTimestamp' > "${LOG_DIR}/all-events.txt" 2>&1 || true
          kubectl describe pods --all-namespaces > "${LOG_DIR}/all-pods-describe.txt" 2>&1 || true

          for ns in $(kubectl get namespaces -o jsonpath='{.items[*].metadata.name}'); do
            for pod in $(kubectl get pods -n "${ns}" -o jsonpath='{.items[*].metadata.name}'); do
              for container in $(kubectl get pod "${pod}" -n "${ns}" -o jsonpath='{.spec.containers[*].name}'); do
                kubectl logs "${pod}" -n "${ns}" -c "${container}" --tail=500 \
                  > "${LOG_DIR}/${ns}_${pod}_${container}.log" 2>&1 || true
              done
            done
          done

    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
          name: e2e-logs-${{ inputs.logPrefix }}-${{ inputs.driverType }}
          path: logs-${{ inputs.logPrefix }}-${{ inputs.driverType }}
