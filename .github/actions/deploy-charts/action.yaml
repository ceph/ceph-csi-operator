name: Deploy Charts Composite Action
description: Deploy Helm charts for Ceph CSI operator and drivers

inputs:
  driverType:
    description: "The CSI driver to deploy (cephfs, rbd, nfs, nvmeof)"
    required: true
  valuesFile:
    description: "Optional Helm values file for storage resources (StorageClass, VolumeSnapshotClass, etc.)"
    required: false
    default: ""
  skipSetup:
    description: "Skip infrastructure setup (minikube, Rook, operator build). Use when setup is already done."
    required: false
    default: "false"
  source:
    description: "Chart source: 'local' (default) uses local chart, 'repo' uses published Helm repo"
    required: false
    default: "local"
  chartVersion:
    description: "Helm chart version to install from repo (required when source=repo)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: checkout
      if: inputs.skipSetup == 'false'
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Setup Minikube
      if: inputs.skipSetup == 'false'
      uses: ./.github/actions/setup-minikube

    - name: Install snapshot controller
      if: inputs.skipSetup == 'false'
      shell: bash
      run: test/scripts/install-snapshot.sh install

    - name: Prepare ceph-csi-operator
      if: inputs.skipSetup == 'false' && inputs.source == 'local'
      shell: bash
      run: IMAGE_TAG=test make docker-build

    - name: Install Helm
      shell: bash
      run: |
          if ! command -v helm &> /dev/null; then
            curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          fi
          helm version

    - name: Add Helm repo
      if: inputs.source == 'repo'
      shell: bash
      run: |
          helm repo add ceph-csi https://ceph.github.io/ceph-csi-operator || true
          helm repo update

    - name: Create driver namespace
      shell: bash
      run: kubectl create namespace csi-driver --dry-run=client -o yaml | kubectl apply -f -

    - name: Lint operator helm chart
      if: inputs.source == 'local'
      shell: bash
      run: helm lint ./deploy/charts/ceph-csi-operator

    - name: Install operator helm chart
      shell: bash
      run: |
          if [ "${{ inputs.source }}" = "repo" ]; then
            helm install csi-operator ceph-csi/ceph-csi-operator \
              --version "${{ inputs.chartVersion }}" \
              --create-namespace \
              --namespace ceph-csi-operator-system \
              --set controllerManager.manager.env.watchNamespace=csi-driver \
              --wait --timeout 5m
          else
            helm install csi-operator ./deploy/charts/ceph-csi-operator \
              --create-namespace \
              --namespace ceph-csi-operator-system \
              --set controllerManager.manager.image.tag=test \
              --set controllerManager.manager.env.watchNamespace=csi-driver
          fi

    - name: Check operator helm release status
      shell: bash
      run: helm status csi-operator --namespace ceph-csi-operator-system

    - name: Check operator is running
      shell: bash
      env:
        DRIVER_TYPE: ${{ inputs.driverType }}
      run: |
        source test/scripts/utils.sh
        check_operator_health

    # Deploy Rook only after the ceph-csi-operator (and its CRDs) is installed:
    # Rook v1.20+ creates a CephConnection CR while bringing up the cluster.
    - name: Deploy Rook Ceph cluster
      if: inputs.skipSetup == 'false'
      uses: ./.github/actions/deploy-rook
      with:
        driverType: ${{ inputs.driverType }}

    - name: Lint csi driver helm chart
      if: inputs.source == 'local'
      shell: bash
      run: helm lint ./deploy/charts/ceph-csi-drivers

    - name: Patch NVMe-oF StorageClass with gateway address
      if: inputs.driverType == 'nvmeof' && inputs.valuesFile != ''
      shell: bash
      run: test/scripts/k8s-storage/patch-nvmeof-storageclass.sh helm "${{ inputs.valuesFile }}"

    - name: Install csi driver helm chart
      shell: bash
      run: |
          if [ "${{ inputs.source }}" = "repo" ]; then
            helm show values ceph-csi/ceph-csi-drivers --version "${{ inputs.chartVersion }}" > /tmp/driver-values.yaml

            DRIVER_NAME="${{ inputs.driverType }}.csi.ceph.com" yq eval --inplace '
            .drivers |=
            with_entries(
              .value.enabled = (.value.name == strenv(DRIVER_NAME)) |
              .value.deployCsiAddons = (.value.name == "rbd.csi.ceph.com") |
              .value.generateOMapInfo = ((.value.name == "cephfs.csi.ceph.com") or (.value.name == "rbd.csi.ceph.com"))
            )
            ' /tmp/driver-values.yaml

            helm_args=(install csi-driver ceph-csi/ceph-csi-drivers
              --version "${{ inputs.chartVersion }}"
              --create-namespace --namespace csi-driver
              --values /tmp/driver-values.yaml
              --wait --timeout 5m)
          else
            DRIVER_NAME="${{ inputs.driverType }}.csi.ceph.com" yq eval --inplace '
            .drivers |=
            with_entries(
              .value.enabled = (.value.name == strenv(DRIVER_NAME)) |
              .value.deployCsiAddons = (.value.name == "rbd.csi.ceph.com") |
              .value.generateOMapInfo = ((.value.name == "cephfs.csi.ceph.com") or (.value.name == "rbd.csi.ceph.com"))
            )
            ' ./deploy/charts/ceph-csi-drivers/values.yaml

            helm_args=(install csi-driver ./deploy/charts/ceph-csi-drivers --create-namespace --namespace csi-driver)
          fi

          if [ -n "${{ inputs.valuesFile }}" ]; then
            MONITOR=$(kubectl -n rook-ceph get svc -l app=rook-ceph-mon \
              -o=jsonpath='{.items[0].spec.clusterIP}:{.items[0].spec.ports[0].port}')
            helm_args+=(-f "${{ inputs.valuesFile }}" --set "cephConnections[0].monitors.mon0=${MONITOR}")
          fi

          helm "${helm_args[@]}"

          git checkout ./deploy/charts/ceph-csi-drivers/values.yaml || true
          rm -f /tmp/driver-values.yaml

    - name: Check csi driver helm release status
      shell: bash
      run: helm status csi-driver --namespace csi-driver

    - name: Check csi pods are running
      shell: bash
      env:
        DRIVER_TYPE: ${{ inputs.driverType }}
      run: |
        source test/scripts/utils.sh
        check_driver_health "${{ inputs.driverType }}"
