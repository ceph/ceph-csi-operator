name: Setup Minikube
description: Setup Go, a Minikube cluster, NVMe/TCP kernel modules, and a local disk for Rook

runs:
  using: "composite"
  steps:
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    - name: Setup Minikube
      shell: bash
      run: test/scripts/github-action-helper.sh install_minikube_with_none_driver

    - name: Print k8s cluster status
      shell: bash
      run: kubectl get nodes

    - name: Install NVMe/TCP Kernel Modules
      shell: bash
      run: |
          # Installing the tooling and extra kernel modules is best-effort: package
          # availability varies across runner kernels and must not fail the job. The
          # only hard requirement is that nvme_tcp can be loaded, verified at the end.
          sudo apt-get update -y || true
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" \
            || sudo apt-get install -y linux-modules-extra-azure \
            || true
          sudo modprobe nvme_fabrics || true
          sudo modprobe nvme_tcp || true
          if [[ ! -d /sys/module/nvme_tcp ]]; then
            echo "nvme_tcp kernel module is unavailable on this runner kernel: $(uname -r)"
            exit 1
          fi

    - name: Use local disk
      shell: bash
      run: test/scripts/github-action-helper.sh use_local_disk
