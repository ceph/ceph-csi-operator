name: helm-upgrade-test

on:
  pull_request:
    branches:
      - main
      - release-*
    paths-ignore:
      - 'docs/**' # ignore all the documents
      - '*.md' # Ignore the Readme and PendingReleaseNote file
      - '.*' # Ignore the config files

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail -x {0}

# cancel the in-progress workflow when PR is refreshed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  helm-upgrade-test:
    name: ${{ matrix.driver }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        driver:
          - cephfs
          - rbd
          - nfs
          - nvmeof
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
            fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Get latest release version
        id: get_release
        run: |
          RELEASE_VERSION=$(gh release list --limit 1 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[0].tagName')
          echo "release_version=${RELEASE_VERSION}" >> $GITHUB_OUTPUT
          echo "chart_version=${RELEASE_VERSION#v}" >> $GITHUB_OUTPUT
          echo "Latest release version: ${RELEASE_VERSION}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install release version via deploy-charts
        uses: ./.github/actions/deploy-charts
        with:
          driverType: ${{ matrix.driver }}
          source: repo
          chartVersion: ${{ steps.get_release.outputs.chart_version }}

      - name: Run helm upgrade test
        env:
          DRIVER_TYPE: ${{ matrix.driver }}
        run: test/scripts/test-upgrade-helm.sh

      - name: Deploy storage resources on upgraded release
        run: |
            if [ "${{ matrix.driver }}" = "nvmeof" ]; then
              test/scripts/k8s-storage/patch-nvmeof-storageclass.sh helm \
                ./test/scripts/k8s-storage/helm/values-${{ matrix.driver }}.yaml
            fi

            MONITOR=$(kubectl -n rook-ceph get svc -l app=rook-ceph-mon \
            -o=jsonpath='{.items[0].spec.clusterIP}:{.items[0].spec.ports[0].port}')

            helm upgrade csi-driver ./deploy/charts/ceph-csi-drivers \
              --namespace csi-driver \
              --reuse-values \
              -f ./test/scripts/k8s-storage/helm/values-${{ matrix.driver }}.yaml \
              --set "cephConnections[0].monitors.mon0=${MONITOR}"

      - name: Run E2E tests
        uses: ./.github/actions/run-e2e-tests
        with:
          driverType: ${{ matrix.driver }}
          logPrefix: helm-upgrade
