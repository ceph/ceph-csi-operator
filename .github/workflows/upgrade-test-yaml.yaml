name: yaml-upgrade-test

on:
  pull_request:
    branches:
      - main
      - release-*
    paths-ignore:
      - 'docs/**' # ignore all the documents
      - '*.md' # Ignore the Readme and PendingReleaseNote file
      - '.*' # Ignore the config files

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail -x {0}

# cancel the in-progress workflow when PR is refreshed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  yaml-upgrade-test:
    name: ${{ matrix.driver }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        driver:
          - cephfs
          - rbd
          - nfs
          - nvmeof
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
            fetch-depth: 0

      - name: Setup Ceph cluster
        uses: ./.github/actions/setup-ceph-cluster
        with:
          driverType: ${{ matrix.driver }}

      - name: Get latest release version
        id: get_release
        run: |
          RELEASE_VERSION=$(gh release list --limit 1 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[0].tagName')
          echo "release_version=${RELEASE_VERSION}" >> $GITHUB_OUTPUT
          echo "Latest release version: ${RELEASE_VERSION}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: run yaml upgrade test
        env:
          RELEASE_VERSION: ${{ steps.get_release.outputs.release_version }}
          SKIP_CLEANUP: "true"
        run: test/scripts/test-upgrade-yaml.sh

      - name: Deploy CSI driver via kubectl
        uses: ./.github/actions/deploy-kubectl-driver
        with:
          driverType: ${{ matrix.driver }}

      - name: Run E2E tests
        uses: ./.github/actions/run-e2e-tests
        with:
          driverType: ${{ matrix.driver }}
          logPrefix: yaml-upgrade
