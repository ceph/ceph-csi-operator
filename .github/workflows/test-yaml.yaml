name: test-yaml
on:
  pull_request:
    branches:
      - main
      - release-*
    paths-ignore:
      - 'docs/**' # ignore all the documents
      - '*.md' # Ignore the Readme and PendingReleaseNote file
      - '.*' # Ignore the config files

defaults:
  run:
    # reference: https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#using-a-specific-shell
    shell: bash --noprofile --norc -eo pipefail -x {0}

# cancel the in-progress workflow when PR is refreshed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.driver }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        driver:
          - cephfs
          - rbd
          - nfs
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
            fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup Minikube
        run: |
            test/scripts/github-action-helper.sh install_minikube_with_none_driver

      - name: print k8s cluster status
        run: |
            kubectl get nodes

      - name: use local disk
        run: test/scripts/github-action-helper.sh use_local_disk

      - name: create ceph cluster
        run: test/scripts/github-action-helper.sh deploy_rook

      - name: Build and install operator
        run: |
            IMAGE_TAG=test make docker-build
            make build-installer
            kubectl create namespace csi-driver --dry-run=client -o yaml | kubectl apply -f -
            kubectl apply --server-side --force-conflicts -f deploy/all-in-one/install.yaml
            kubectl set env deployment/ceph-csi-operator-controller-manager -n ceph-csi-operator-system WATCH_NAMESPACE=csi-driver
            kubectl rollout status deployment/ceph-csi-operator-controller-manager -n ceph-csi-operator-system --timeout=300s
            source test/scripts/utils.sh
            check_operator_health

      - name: Deploy CSI driver via kubectl
        uses: ./.github/actions/deploy-kubectl-driver
        with:
          driverType: ${{ matrix.driver }}

      - name: Run E2E tests
        uses: ./.github/actions/run-e2e-tests
        with:
          driverType: ${{ matrix.driver }}
          logPrefix: yaml
