# Configuration for Ceph Connections
cephConnections:
  - # -- Name for the Ceph connection (default: "")
    name: ""
    # -- Ceph monitors (key-value pairs, typically IP addresses of the Ceph monitors) (default: {})
    monitors: {}
    # -- Number of RBD mirror daemons (default: 1)
    rbdMirrorDaemonCount: 1
    # -- Labels to be used for CRUSH location selection (default: [])
    # Leave empty to disable read affinity. When set, it must be a non-empty list of node label keys, e.g. ["topology.kubernetes.io/zone"].
    crushLocationLabels: []
# Configuration for Client Profiles
clientProfiles:
  - # -- Name of the client profile (default: "")
    name: ""
    cephConnection:
      # -- Reference to the Ceph connection for this profile (default: "")
      name: ""
    cephFs:
      # -- Mount options for CephFS with FUSE (default: {})
      fuseMountOptions: {}
      # -- Mount options for CephFS with the kernel (default: {})
      kernelMountOptions: {}
      # -- Sub-volume group for the CephFS client (default: "")
      subVolumeGroup: ""
      # -- Ceph CSI secret references for CephFS (default: {})
      cephCsiSecrets:
        controllerPublishSecret:
          # -- Name of the controller publish secret (default: "")
          name: ""
          # -- Namespace of the controller publish secret (default: "")
          namespace: ""
        nodePublishSecret:
          # -- Name of the node publish secret (default: "")
          name: ""
          # -- Namespace of the node publish secret (default: "")
          namespace: ""
    rbd:
      # -- Namespace for RADOS block devices (default: "")
      radosNamespace: ""
      # -- Ceph CSI secret references for RBD (default: {})
      cephCsiSecrets:
        controllerPublishSecret:
          # -- Name of the controller publish secret (default: "")
          name: ""
          # -- Namespace of the controller publish secret (default: "")
          namespace: ""
        nodePublishSecret:
          # -- Name of the node publish secret (default: "")
          name: ""
          # -- Namespace of the node publish secret (default: "")
          namespace: ""
    nvmeof:
      # -- Namespace for RADOS block devices (default: "")
      radosNamespace: ""
      # -- Ceph CSI secret references for NVMe-oF (default: {})
      cephCsiSecrets:
        controllerPublishSecret:
          # -- Name of the controller publish secret (default: "")
          name: ""
          # -- Namespace of the controller publish secret (default: "")
          namespace: ""
        nodePublishSecret:
          # -- Name of the node publish secret (default: "")
          name: ""
          # -- Namespace of the node publish secret (default: "")
          namespace: ""
# Configuration for Client Profile Replications
clientProfileReplications:
  - # -- Name of the client profile replication (default: "")
    name: ""
    # -- Name of the local ClientProfile CR (default: "")
    localClientProfile: ""
    # -- Name of the remote cluster's client profile (default: "")
    remoteClientProfile: ""
    rbd:
      # -- Pool mappings from local pool names to remote pool IDs (default: [])
      poolMapping: []
      # Example:
      # - name: "my-pool"
      #   remoteID: "2"
# Operator configuration section
operatorConfig:
  # -- Name of the operator config (default: "ceph-csi-operator-config")
  name: ceph-csi-operator-config
  # -- Namespace for the operator configuration (default: "")
  namespace: ""
  # -- Flag to indicate if the config should be created (default: true)
  create: true
  driverSpecDefaults:
    log:
      # -- Log verbosity level (0-5) (default: 0)
      verbosity: 0
      rotation:
        # -- Enable log rotation (default: true)
        enabled: true
        # -- Maximum number of log files to keep (default: 7)
        maxFiles: 7
        # -- Maximum size of each log file (default: "10G")
        maxLogSize: "10G"
        # -- Periodicity for log rotation (options: hourly, daily, weekly, monthly) (default: "daily")
        periodicity: "daily"
        # -- Default log directory path (default: "")
        logHostPath: ""
    imageSet:
      # -- ConfigMap reference to the image set for the driver (default: "")
      name: ""
    # -- Cluster name identifier (default: "")
    clusterName: ""
    # -- Flag to enable fencing (default: false)
    enableFencing: false
    # -- gRPC timeout in seconds (default: 30)
    grpcTimeout: 30
    # -- Snapshot policy (options: none, volumeGroupSnapshot, volumeSnapshot) (default: "none")
    snapshotPolicy: "none"
    # -- Flag to generate OMap info (default: false)
    generateOMapInfo: false
    # -- File system group policy (e.g., "None", "ReadWriteOnceWithFSType") (default: "File")
    fsGroupPolicy: "File"
    encryption:
      configMapRef:
        # -- Name of the ConfigMap for encryption settings (default: "")
        name: ""
    # -- Flag indicating whether attachment is required (default: true)
    attachRequired: true
    # -- Flag to deploy CSI Addons (default: false)
    deployCsiAddons: false
    liveness:
      # -- Port served by the liveness sidecar, exposing the CSI metrics that
      # Prometheus scrapes. Leave at 0 to not deploy the liveness sidecar (default: 0)
      metricsPort: 0
    podMonitor:
      # -- Create a PodMonitor resource for this driver, so that the Prometheus
      # Operator scrapes the CSI metrics. Requires the Prometheus Operator to be
      # installed and requires liveness.metricsPort to be set. (default: false)
      enabled: false
      # -- Additional labels to set on the PodMonitor resource (default: {})
      labels: {}
      # -- Additional annotations to set on the PodMonitor resource (default: {})
      annotations: {}
      # -- Prometheus scrape interval for the metrics endpoint, e.g. "30s".
      # If empty, the Prometheus global scrape interval is used. (default: "")
      interval: ""
    # -- CephFS client type (options: autodetect, kernel) (default: "kernel")
    cephFsClientType: "kernel"
    # -- Kernel mount options (default: {})
    kernelMountOptions: {}
    # -- FUSE mount options (default: {})
    fuseMountOptions: {}
    # Node Plugin Configuration
    nodePlugin:
      # -- Pod's priority class name (default: "")
      priorityClassName: ""
      # -- kubelet directory path (default: "/var/lib/kubelet")
      kubeletDirPath: "/var/lib/kubelet"
      # -- Custom labels for the pod (default: {})
      labels: {}
      # -- Custom annotations for the pod (default: {})
      annotations: {}
      # -- Affinity settings for the pod (default: {})
      affinity: {}
      # -- Daemonset update strategy (default: {})
      updateStrategy: {}
      # -- List of tolerations for the pod (default: [])
      tolerations: []
      # -- List of volumes attached to the pod (default: [])
      volumes: []
      # -- Image pull policy (default: "IfNotPresent")
      imagePullPolicy: "IfNotPresent"
      # -- Extra arguments for node plugin containers. Key: container name, Value: list of CLI arguments. Examples: csi-rbdplugin, driver-registrar, csi-addons (default: {})
      containerExtraArgs: {}
    # Controller Plugin Configuration
    controllerPlugin:
      # -- Flag to use host network for the controller plugin (default: false)
      hostNetwork: false
      # -- Number of replicas for the controller plugin (default: 1)
      replicas: 1
      # -- Resource requirements for controller plugin containers (default: {})
      resources: {}
      # -- Deployment strategy for the controller plugin (default: {})
      deploymentStrategy: {}
      # -- Flag to indicate if the container should be privileged (default: false)
      privileged: false
      # -- List of tolerations for the controller plugin (default: [])
      tolerations: []
      # -- Extra arguments for controller plugin containers. Key: container name, Value: list of CLI arguments. Examples: csi-provisioner, csi-attacher, csi-resizer, csi-snapshotter (default: {})
      containerExtraArgs: {}
      # -- Affinity settings for the pod (default: {})
      affinity: {}
      # -- Image pull policy (default: "IfNotPresent")
      imagePullPolicy: "IfNotPresent"
