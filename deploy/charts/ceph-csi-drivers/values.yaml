    #   nodeSecretNamespace: ""
    #   parameters:
    #     clusterID: "<cluster-id>"
    #     fsName: myfs
    # -- List of VolumeSnapshotClass resources to create (requires snapshot.storage.k8s.io/v1 CRD) (default: [])
    # For all available parameters, see <https://github.com/ceph/ceph-csi/blob/devel/examples/cephfs/snapshotclass.yaml>
    volumeSnapshotClasses: []
    # Example:
    # - name: csi-cephfs-snapclass
    #   annotations: {}
    #   labels: {}
    #   isDefault: false
    #   deletionPolicy: Delete
    #   snapshotterSecretName: csi-cephfs-secret
    #   snapshotterSecretNamespace: ""
    #   parameters:
    #     clusterID: "<cluster-id>"
    # -- List of VolumeGroupSnapshotClass resources to create (requires groupsnapshot.storage.k8s.io/v1 CRD) (default: [])
    # For all available parameters, see <https://github.com/ceph/ceph-csi/blob/devel/examples/cephfs/groupsnapshotclass.yaml>
    volumeGroupSnapshotClasses: []
    # Example:
    # - name: csi-cephfs-groupsnapclass
    #   annotations: {}
    #   labels: {}
    #   deletionPolicy: Delete
    #   groupSnapshotterSecretName: csi-cephfs-secret
    #   groupSnapshotterSecretNamespace: ""
    #   parameters:
    #     clusterID: "<cluster-id>"
    #     fsName: myfs
    # -- List of VolumeAttributesClass resources to create (requires storage.k8s.io/v1 VolumeAttributesClass CRD) (default: [])
    # For all available parameters, see <https://github.com/ceph/ceph-csi/blob/devel/examples/cephfs/volumeattributesclass.yaml>
    volumeAttributesClasses: []
    # Example (MDS pinning options are mutually exclusive - set at most one):
    # - name: csi-cephfs-vac
    #   annotations: {}
    #   labels: {}
    #   parameters:
    #     mds-pin-distributed: "1"
  # NFS driver configuration
  nfs:
    # -- CSI driver name for NFS (default: "nfs.csi.ceph.com")
    name: "nfs.csi.ceph.com"
    # -- Enable the NFS driver (default: true)
    enabled: true
    log:
      # -- Log verbosity level (0-5) (default: 0)
      verbosity: 0
      rotation:
        # -- Enable log rotation (default: true)
        enabled: true
        # -- Maximum number of log files to keep (default: 7)
        maxFiles: 7
        # -- Maximum size of each log file (default: "10G")
        maxLogSize: "10G"
        # -- Periodicity for log rotation (options: hourly, daily, weekly, monthly) (default: "daily")
        periodicity: "daily"
        # -- Default log directory path (default: "")
        logHostPath: ""
    imageSet:
      # -- ConfigMap reference to the image set for the driver (default: "")
      name: ""
    # -- Cluster name identifier (default: "")
    clusterName: ""
    # -- Flag to enable fencing (default: false)
    enableFencing: false
    # -- gRPC timeout in seconds (default: 30)
    grpcTimeout: 30
    # -- Snapshot policy (options: none, volumeGroupSnapshot, volumeSnapshot) (default: "volumeSnapshot")
    snapshotPolicy: "volumeSnapshot"
    # -- Flag to generate OMap info (default: false)
    generateOMapInfo: false
    # -- File system group policy (e.g., "None", "ReadWriteOnceWithFSType") (default: "File")
    fsGroupPolicy: "File"
    encryption:
      configMapRef:
        # -- Name of the ConfigMap for encryption settings (default: "")
        name: ""
    # -- Flag indicating whether attachment is required (default: true)
    attachRequired: true
    # -- Flag to deploy CSI Addons (default: false)
    deployCsiAddons: false
    liveness:
      # -- Port served by the liveness sidecar, exposing the CSI metrics that
      # Prometheus scrapes. Leave at 0 to not deploy the liveness sidecar (default: 0)
      metricsPort: 0
    podMonitor:
      # -- Create a PodMonitor resource for this driver, so that the Prometheus
      # Operator scrapes the CSI metrics. Requires the Prometheus Operator to be
      # installed and requires liveness.metricsPort to be set. (default: false)
      enabled: false
      # -- Additional labels to set on the PodMonitor resource (default: {})
      labels: {}
      # -- Additional annotations to set on the PodMonitor resource (default: {})
      annotations: {}
      # -- Prometheus scrape interval for the metrics endpoint, e.g. "30s".
      # If empty, the Prometheus global scrape interval is used. (default: "")
      interval: ""
    # -- CephFS client type (options: autodetect, kernel) (default: "kernel")
    cephFsClientType: "kernel"
    # -- Kernel mount options (default: {})
    kernelMountOptions: {}
    # -- FUSE mount options (default: {})
    fuseMountOptions: {}
    # Node Plugin Configuration
    nodePlugin:
      # -- Service account name for the pod (default: "")
      serviceAccountName: ""
      # -- Pod's priority class name (default: "")
      priorityClassName: ""
      # -- Custom labels for the pod (default: {})
      labels: {}
      # -- Custom annotations for the pod (default: {})
      annotations: {}
      # -- Affinity settings for the pod (default: {})
      affinity: {}
      # -- List of tolerations for the pod (default: [])
      tolerations: []
      # -- List of volumes attached to the pod (default: [])
      volumes: []
      # -- Image pull policy (default: "IfNotPresent")
      imagePullPolicy: "IfNotPresent"
      # -- Extra arguments for node plugin containers. Key: container name, Value: list of CLI arguments. Examples: csi-rbdplugin, driver-registrar, csi-addons (default: {})
      containerExtraArgs: {}
    # Controller Plugin Configuration
    controllerPlugin:
      # -- Flag to use host network for the controller plugin (default: false)
      hostNetwork: false
      # -- Number of replicas for the controller plugin (default: 1)
      replicas: 1
      # -- Resource requirements for controller plugin containers (default: {})
      resources: {}
      # -- Deployment strategy for the controller plugin (default: {})
      deploymentStrategy: {}
      # -- Flag to indicate if the container should be privileged (default: false)
      privileged: false
      # -- List of tolerations for the controller plugin (default: [])
      tolerations: []
      # -- Extra arguments for controller plugin containers. Key: container name, Value: list of CLI arguments. Examples: csi-provisioner, csi-attacher, csi-resizer, csi-snapshotter (default: {})
      containerExtraArgs: {}
    # -- List of StorageClass resources to create for this driver (default: [])
    # For all available parameters, see <https://github.com/ceph/ceph-csi/blob/devel/examples/nfs/storageclass.yaml>
    storageClasses: []
    # Example:
    # - name: csi-nfs-sc
    #   annotations: {}
    #   labels: {}
    #   isDefault: false
    #   reclaimPolicy: Delete
    #   allowVolumeExpansion: true
    #   volumeBindingMode: Immediate
    #   mountOptions: []
    #   provisionerSecretName: csi-nfs-secret
    #   provisionerSecretNamespace: ""
    #   nodeSecretName: csi-nfs-secret
    #   nodeSecretNamespace: ""
    #   parameters:
    #     clusterID: "<cluster-id>"
    #     nfsCluster: "<nfs-cluster>"
    #     server: "<nfs-server>"
    #     fsName: myfs
    # -- List of VolumeSnapshotClass resources to create (requires snapshot.storage.k8s.io/v1 CRD) (default: [])
    # For all available parameters, see <https://github.com/ceph/ceph-csi/blob/devel/examples/nfs/snapshotclass.yaml>
    volumeSnapshotClasses: []
    # Example:
    # - name: csi-nfs-snapclass
    #   annotations: {}
    #   labels: {}
    #   isDefault: false
    #   deletionPolicy: Delete
    #   snapshotterSecretName: csi-nfs-secret
    #   snapshotterSecretNamespace: ""
    #   parameters:
    #     clusterID: "<cluster-id>"
    # -- List of VolumeGroupSnapshotClass resources to create (requires groupsnapshot.storage.k8s.io/v1 CRD) (default: [])
    # For all available parameters, see <https://github.com/ceph/ceph-csi/blob/devel/examples/nfs/groupsnapshotclass.yaml>
    volumeGroupSnapshotClasses: []
    # Example:
    # - name: csi-nfs-groupsnapclass
    #   annotations: {}
    #   labels: {}
    #   deletionPolicy: Delete
    #   groupSnapshotterSecretName: csi-nfs-secret
    #   groupSnapshotterSecretNamespace: ""
    #   parameters:
    #     clusterID: "<cluster-id>"
    #     fsName: myfs
    # -- List of VolumeAttributesClass resources to create (requires storage.k8s.io/v1 VolumeAttributesClass CRD) (default: [])
    # For all available parameters, see <https://github.com/ceph/ceph-csi/blob/devel/examples/nfs/volumeattributesclass.yaml>
    volumeAttributesClasses: []
    # Example:
    # - name: csi-nfs-vac
    #   annotations: {}
    #   labels: {}
    #   parameters:
    #     server: "<nfs-server>"
    #     clients: "<client-list>"
# -- List of Secret resources to create for CSI driver authentication (default: [])
secrets: []
# Example:
# - name: csi-rbd-secret
#   namespace: ""
#   annotations: {}
#   labels: {}
#   stringData:
#     userID: admin
#     userKey: AQBxxxxxxxxxxxxxx==
# -- List of extra Kubernetes resources to deploy alongside the chart. Supports Helm templating via tpl (default: [])
extraDeploy: []
# -- List of pull secret names that will be added to all serviceaccounts (default: [])
imagePullSecrets: []
# OpenShift configuration
openshift:
  # -- Enable OpenShift-specific resources (ClusterRoleBindings for SCC) (default: false)
  enabled: false
  # -- Name of the SCC ClusterRole created by the operator chart (default: "ceph-csi-operator-scc-user")
  # This should match the ClusterRole name from the operator chart: {{ operator-release-name }}-scc-user
  sccClusterRoleName: "ceph-csi-operator-scc-user"
