      containerExtraArgs: {}
    # -- List of StorageClass resources to create for this driver (default: [])
    # For all available parameters, see <https://github.com/ceph/ceph-csi/blob/devel/examples/rbd/storageclass.yaml>
    storageClasses: []
    # Example:
    # - name: csi-rbd-sc
    #   annotations: {}
    #   labels: {}
    #   isDefault: false
    #   reclaimPolicy: Delete
    #   allowVolumeExpansion: true
    #   volumeBindingMode: Immediate
    #   mountOptions: []
