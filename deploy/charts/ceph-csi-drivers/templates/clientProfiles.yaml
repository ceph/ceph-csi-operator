{{- $root := . -}}
{{- range $clientProfile := .Values.clientProfiles -}}
{{- if $clientProfile.name }}
---
apiVersion: csi.ceph.io/v1
kind: ClientProfile
metadata:
  name: {{  $clientProfile.name  }}
  namespace: {{ $root.Release.Namespace }}
spec:
  cephConnectionRef:
    name: {{  $clientProfile.cephConnection.name  }}
  {{- if $clientProfile.cephFs }}
  {{- $cephFsHasSecrets := and $clientProfile.cephFs.cephCsiSecrets (or (and $clientProfile.cephFs.cephCsiSecrets.controllerPublishSecret $clientProfile.cephFs.cephCsiSecrets.controllerPublishSecret.name) (and $clientProfile.cephFs.cephCsiSecrets.nodePublishSecret $clientProfile.cephFs.cephCsiSecrets.nodePublishSecret.name)) }}
  {{- if or $clientProfile.cephFs.subVolumeGroup $clientProfile.cephFs.radosNamespace $clientProfile.cephFs.fuseMountOptions $clientProfile.cephFs.kernelMountOptions $cephFsHasSecrets }}
  cephFs:
    {{- if $clientProfile.cephFs.fuseMountOptions }}
    fuseMountOptions:
      {{ range $key, $value := $clientProfile.cephFs.fuseMountOptions }}
         {{ $key }}: {{ $value }}
      {{ end }}
    {{- end }}
    {{- if $clientProfile.cephFs.kernelMountOptions }}
    kernelMountOptions:
    {{ range $key, $value := $clientProfile.cephFs.kernelMountOptions }}
         {{ $key }}: {{ $value }}
      {{ end }}
    {{- end }}
    {{- if $clientProfile.cephFs.subVolumeGroup }}
    subVolumeGroup: {{ $clientProfile.cephFs.subVolumeGroup }}
    {{- end }}
    {{- if $clientProfile.cephFs.radosNamespace }}
    radosNamespace: {{ $clientProfile.cephFs.radosNamespace }}
    {{- end }}
    {{- if $cephFsHasSecrets }}
    cephCsiSecrets:
      {{- if and $clientProfile.cephFs.cephCsiSecrets.controllerPublishSecret $clientProfile.cephFs.cephCsiSecrets.controllerPublishSecret.name }}
      controllerPublishSecret:
        name: {{ $clientProfile.cephFs.cephCsiSecrets.controllerPublishSecret.name }}
        {{- if $clientProfile.cephFs.cephCsiSecrets.controllerPublishSecret.namespace }}
        namespace: {{ $clientProfile.cephFs.cephCsiSecrets.controllerPublishSecret.namespace }}
        {{- end }}
      {{- end }}
      {{- if and $clientProfile.cephFs.cephCsiSecrets.nodePublishSecret $clientProfile.cephFs.cephCsiSecrets.nodePublishSecret.name }}
      nodePublishSecret:
        name: {{ $clientProfile.cephFs.cephCsiSecrets.nodePublishSecret.name }}
        {{- if $clientProfile.cephFs.cephCsiSecrets.nodePublishSecret.namespace }}
        namespace: {{ $clientProfile.cephFs.cephCsiSecrets.nodePublishSecret.namespace }}
        {{- end }}
      {{- end }}
    {{- end }}
  {{- else }}
  cephFs: {}
  {{- end }}
  {{- end }}
  {{- if $clientProfile.rbd }}
  {{- $rbdHasSecrets := and $clientProfile.rbd.cephCsiSecrets (or (and $clientProfile.rbd.cephCsiSecrets.controllerPublishSecret $clientProfile.rbd.cephCsiSecrets.controllerPublishSecret.name) (and $clientProfile.rbd.cephCsiSecrets.nodePublishSecret $clientProfile.rbd.cephCsiSecrets.nodePublishSecret.name)) }}
  {{- if or $clientProfile.rbd.radosNamespace $rbdHasSecrets }}
  rbd:
    {{- if $clientProfile.rbd.radosNamespace }}
    radosNamespace: {{ $clientProfile.rbd.radosNamespace }}
    {{- end }}
    {{- if $rbdHasSecrets }}
    cephCsiSecrets:
      {{- if and $clientProfile.rbd.cephCsiSecrets.controllerPublishSecret $clientProfile.rbd.cephCsiSecrets.controllerPublishSecret.name }}
      controllerPublishSecret:
        name: {{ $clientProfile.rbd.cephCsiSecrets.controllerPublishSecret.name }}
        {{- if $clientProfile.rbd.cephCsiSecrets.controllerPublishSecret.namespace }}
        namespace: {{ $clientProfile.rbd.cephCsiSecrets.controllerPublishSecret.namespace }}
        {{- end }}
      {{- end }}
      {{- if and $clientProfile.rbd.cephCsiSecrets.nodePublishSecret $clientProfile.rbd.cephCsiSecrets.nodePublishSecret.name }}
      nodePublishSecret:
        name: {{ $clientProfile.rbd.cephCsiSecrets.nodePublishSecret.name }}
        {{- if $clientProfile.rbd.cephCsiSecrets.nodePublishSecret.namespace }}
        namespace: {{ $clientProfile.rbd.cephCsiSecrets.nodePublishSecret.namespace }}
        {{- end }}
      {{- end }}
    {{- end }}
  {{- else }}
  rbd: {}
  {{- end }}
  {{- end }}
  {{- if $clientProfile.nvmeof }}
  {{- $nvmeofHasSecrets := and $clientProfile.nvmeof.cephCsiSecrets (or (and $clientProfile.nvmeof.cephCsiSecrets.controllerPublishSecret $clientProfile.nvmeof.cephCsiSecrets.controllerPublishSecret.name) (and $clientProfile.nvmeof.cephCsiSecrets.nodePublishSecret $clientProfile.nvmeof.cephCsiSecrets.nodePublishSecret.name)) }}
  {{- if or $clientProfile.nvmeof.radosNamespace $nvmeofHasSecrets }}
  nvmeof:
    {{- if $clientProfile.nvmeof.radosNamespace }}
    radosNamespace: {{ $clientProfile.nvmeof.radosNamespace }}
    {{- end }}
    {{- if $nvmeofHasSecrets }}
    cephCsiSecrets:
      {{- if and $clientProfile.nvmeof.cephCsiSecrets.controllerPublishSecret $clientProfile.nvmeof.cephCsiSecrets.controllerPublishSecret.name }}
      controllerPublishSecret:
        name: {{ $clientProfile.nvmeof.cephCsiSecrets.controllerPublishSecret.name }}
        {{- if $clientProfile.nvmeof.cephCsiSecrets.controllerPublishSecret.namespace }}
        namespace: {{ $clientProfile.nvmeof.cephCsiSecrets.controllerPublishSecret.namespace }}
        {{- end }}
      {{- end }}
      {{- if and $clientProfile.nvmeof.cephCsiSecrets.nodePublishSecret $clientProfile.nvmeof.cephCsiSecrets.nodePublishSecret.name }}
      nodePublishSecret:
        name: {{ $clientProfile.nvmeof.cephCsiSecrets.nodePublishSecret.name }}
        {{- if $clientProfile.nvmeof.cephCsiSecrets.nodePublishSecret.namespace }}
        namespace: {{ $clientProfile.nvmeof.cephCsiSecrets.nodePublishSecret.namespace }}
        {{- end }}
      {{- end }}
    {{- end }}
  {{- else }}
  nvmeof: {}
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}
